[project]
name = "YOLO Pipeline"
description = "TensorRT hızlandırmalı nesne tespit pipeline'ı"
version = "0.1.0"
author = "Emre Karakaya"

[logger]
filepath = "./logs/local.log"
rotation = "50MB"

[camera]
source = "test_videos/2mintest.mp4"
width = 680
height = 400
delay = 1

[benchmark]
pytorch_weights = "models/pytorch/yolo26n.pt"
fp32_weights = "models/engine/yolo26n_fp32.engine"
fp16_weights = "models/engine/yolo26n_fp16.engine"
warmup = 20
runs = 6000

[inference]
weights = "models/engine/yolo26n_fp16.engine"
conf = 0.3
imgsz = 640
device = 0

[export]
weights = "models/pytorch/yolo26n.pt"
onnx_path = "models/onnx/yolo26n_fp32.onnx"
onnx_fp16_path = "models/onnx/yolo26n_fp16.onnx"
imgsz = 640
opset = 17  
device = 0

[engine]
onnx_path = "models/onnx/yolo26n_fp32.onnx"
onnx_fp16_path = "models/onnx/yolo26n_fp16.onnx"
fp32_path = "models/engine/yolo26n_fp32.engine"
fp16_path = "models/engine/yolo26n_fp16.engine"
workspace = 4